<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --iris: #692475; --iris-light: #A47DAB; --iris-pale: #f5eef7;
  --green: #82AB7D; --green-dark: #4a7a45; --green-pale: #eef5ed;
  --bg: #fdf8fe; --card: #fff; --text: #2a1f2d; --muted: #8a6f90; --border: #e8d8ed;
}
body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; max-width: 480px; margin: 0 auto; }
.header { background: var(--iris); padding: 1.75rem 1.25rem 2.8rem; text-align: center; position: relative; overflow: hidden; }
.bubble { position: absolute; border-radius: 50%; opacity: 0.10; background: #fff; pointer-events: none; }
.header-globe { font-size: 36px; display: block; margin-bottom: 4px; }
.header-name { font-size: 19px; font-weight: 700; color: #fff; }
.header-sub { font-size: 12px; color: #d4aede; margin-top: 2px; }
.lang-pills { display: flex; justify-content: center; gap: 7px; margin-top: 9px; }
.lang-pill { background: rgba(255,255,255,0.18); color: #fff; font-size: 11px; font-weight: 600; padding: 3px 11px; border-radius: 20px; }
.tabs { display: flex; padding: 0 1rem; gap: 8px; margin-top: -1.4rem; position: relative; z-index: 2; margin-bottom: 0.75rem; }
.tab-btn { flex: 1; padding: 9px 4px; background: #e8d8ed; color: var(--iris); border: none; border-radius: 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.tab-btn.active { background: var(--iris); color: #fff; box-shadow: 0 4px 12px rgba(105,36,117,0.22); }
.section { display: none; padding: 0 1rem 2rem; }
.section.active { display: block; }
.login-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 20px; padding: 1.5rem 1.25rem; text-align: center; margin-top: 0.5rem; }
.login-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.login-sub { font-size: 13px; color: var(--muted); margin-bottom: 1.25rem; line-height: 1.5; }
.login-input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 14px; color: var(--text); background: var(--bg); margin-bottom: 10px; outline: none; }
.login-input:focus { border-color: var(--iris-light); }
.login-btn { width: 100%; padding: 11px; background: var(--iris); color: #fff; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
.login-error { font-size: 12px; color: #c62828; margin-top: 8px; min-height: 16px; }
.logout-btn { font-size: 11px; color: var(--muted); background: none; border: 1px solid var(--border); border-radius: 8px; padding: 4px 9px; cursor: pointer; }
.section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--iris-light); margin-bottom: 8px; display: block; }
.alumno-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; background: var(--card); border: 1.5px solid var(--border); border-radius: 16px; padding: 0.85rem 1rem; }
.av-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--iris); color: #fff; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.av-name { font-size: 15px; font-weight: 700; }
.av-pack { font-size: 12px; color: var(--muted); }
.progress-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 16px; padding: 1rem; margin-bottom: 10px; }
.prog-title { font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--iris-light); margin-bottom: 8px; }
.prog-nums { display: flex; gap: 8px; margin-bottom: 10px; }
.prog-num { flex: 1; text-align: center; background: var(--iris-pale); border-radius: 12px; padding: 8px 4px; }
.prog-n { font-size: 22px; font-weight: 800; color: var(--iris); }
.prog-l { font-size: 10px; color: var(--muted); }
.barra-track { background: #ede0f2; border-radius: 20px; height: 9px; overflow: hidden; }
.barra-fill { height: 9px; border-radius: 20px; background: var(--iris); }
.barra-fill.verde { background: var(--green); }
.pago-card { background: #fffbea; border: 1.5px solid #f0e08a; border-radius: 14px; padding: 0.85rem 1rem; margin-bottom: 10px; font-size: 13px; color: #5a4a00; line-height: 1.6; }
.pago-card strong { color: #3a2f00; }
